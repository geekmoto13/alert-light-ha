# Works with no extra cards or themes (no colors).
type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: EVACUATE
        icon: mdi:exit-run
        tap_action:
          action: perform-action
          perform_action: script.alert_lights
          data:
            mode: evacuate
          confirmation:
            text: Start the evacuation alert?
      - type: button
        name: ALL CLEAR
        icon: mdi:check-circle
        tap_action:
          action: perform-action
          perform_action: script.alert_lights
          data:
            mode: clear
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        name: STORM
        icon: mdi:weather-lightning
        tap_action:
          action: perform-action
          perform_action: script.alert_lights
          data:
            mode: storm
      - type: button
        name: WIND
        icon: mdi:weather-windy
        tap_action:
          action: perform-action
          perform_action: script.alert_lights
          data:
            mode: wind
      - type: button
        name: HEAT
        icon: mdi:thermometer-high
        tap_action:
          action: perform-action
          perform_action: script.alert_lights
          data:
            mode: heat
